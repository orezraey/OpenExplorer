# Builds Open Explorer for Windows, Linux and macOS on GitHub's machines.
#
# - Pushing a tag v* (git tag v0.1.0, then git push origin v0.1.0) builds the three and publishes
#   a release with their packages. The tag must match the version in Cargo.toml.
# - Run by hand (Actions > Release > Run workflow), it only builds: the packages stay in the run's
#   artifacts, a dry run before tagging.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          # The oldest Ubuntu runner: the binaries then run on any Linux with glibc 2.35 or newer.
          - name: linux-x64
            os: ubuntu-22.04
          # Apple Silicon and Intel in one universal app.
          - name: macos-universal
            os: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match the version $version in Cargo.toml."
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then label="$version"; else label="$version-dev.${GITHUB_SHA::7}"; fi
          echo "PKG=OpenExplorer-$label-${{ matrix.name }}" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The Rust that rust-toolchain.toml pins (the one Rune builds with).
      - name: Rust
        run: |
          rustup toolchain install --profile minimal
          if [[ "$RUNNER_OS" == macOS ]]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev libx11-dev libdbus-1-dev

      - name: Build (Windows, Linux)
        if: runner.os != 'macOS'
        run: cargo build --release --locked -p openexplorer

      - name: Build (macOS, both architectures)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked -p openexplorer --target aarch64-apple-darwin
          cargo build --release --locked -p openexplorer --target x86_64-apple-darwin

      # Two downloads: an installer (Inno Setup: Program Files, Start menu, Add or remove
      # programs) and the same .exe to run without installing. One .exe is the app and also the
      # search service (`openexplorer index`).
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/openexplorer.exe "dist/$env:PKG-portable.exe"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc /Q "/DAppVersion=$env:VERSION" "/DSourceExe=$PWD\target\release\openexplorer.exe" "/DOutputName=$env:PKG-setup" installer/openexplorer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The installer installs, the search service joins it, and uninstalling takes both away.
      - name: Try the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-Item "dist/$env:PKG-setup.exe"
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $app = "$env:ProgramFiles\OpenExplorer"
          if (-not (Test-Path "$app\openexplorer.exe")) { throw "not installed in $app" }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Open Explorer.lnk")) { throw "no Start menu shortcut" }
          Start-Process "$app\openexplorer.exe" -ArgumentList 'index', 'install' -Wait
          if (-not (Get-Service OpenExplorerIndex -ErrorAction SilentlyContinue)) { throw "the search service didn't install" }
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # The uninstaller hands over to a copy of itself and returns at once: wait for it.
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\openexplorer.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Get-Service OpenExplorerIndex -ErrorAction SilentlyContinue) { throw "the search service stayed after uninstalling" }
          if (Test-Path "$app\openexplorer.exe") { throw "the app stayed after uninstalling" }
          "installed, search service added, both removed"

      # The executable (also the search service) in a .tar.gz, which keeps its permission to run:
      # a bare file downloaded by a browser loses it.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          chmod +x target/release/openexplorer
          tar czf "dist/$PKG.tar.gz" -C target/release openexplorer

      # An .app bundle, signed ad hoc (no Apple Developer account): macOS asks once before opening it.
      # A bundle is a folder, so it goes in a .zip (ditto keeps its signature).
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          app="dist/Open Explorer.app"
          mkdir -p "$app/Contents/MacOS"
          lipo -create -output "$app/Contents/MacOS/openexplorer" \
            target/aarch64-apple-darwin/release/openexplorer target/x86_64-apple-darwin/release/openexplorer
          chmod +x "$app/Contents/MacOS/openexplorer"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Open Explorer</string>
            <key>CFBundleDisplayName</key><string>Open Explorer</string>
            <key>CFBundleIdentifier</key><string>io.github.openexplorer</string>
            <key>CFBundleExecutable</key><string>openexplorer</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "$app"
          cd dist && ditto -c -k --keepParent "Open Explorer.app" "$PKG.zip" && rm -rf "Open Explorer.app"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # v0.2.0-beta.1 and the like are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
