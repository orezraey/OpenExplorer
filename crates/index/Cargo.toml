[package]
name = "openexplorer-index"
version = "0.0.1"
edition.workspace = true

# The service: `openexplorer-index install|uninstall|console`, and run by Windows as a service.
[[bin]]
name = "openexplorer-index"
path = "src/main.rs"

[dependencies]
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Reads each volume's $MFT and its USN change journal.
ntfs-reader = "0.6"
windows-service = "0.8"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Services", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
