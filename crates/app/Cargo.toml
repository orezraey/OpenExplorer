[package]
name = "openexplorer"
version = "0.0.1"
edition.workspace = true

[dependencies]
rune = { workspace = true }
rune-kit = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
openexplorer-gdrive = { path = "../gdrive" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
