[package]
name = "openexplorer"
version.workspace = true
edition.workspace = true

[dependencies]
rune = { workspace = true }
rune-kit = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
openexplorer-dropbox = { path = "../dropbox" }
openexplorer-b2 = { path = "../b2" }
openexplorer-gdrive = { path = "../gdrive" }
openexplorer-mega = { path = "../mega" }
openexplorer-onedrive = { path = "../onedrive" }
openexplorer-telegram = { path = "../telegram" }
openexplorer-i18n = { path = "../i18n" }
openexplorer-remote = { path = "../remote" }
openexplorer-index = { path = "../index" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Deleting local files sends them to the Recycle Bin.
trash = "5"
md-5 = "0.10"
regex = "1"

[dev-dependencies]
# The Dropbox crate's stand-in for the API, for the tests of the panes' batches.
openexplorer-dropbox = { path = "../dropbox", features = ["fake"] }
# The Telegram crate's channel in memory, for the tests of the panes' work on Telegram.
openexplorer-telegram = { path = "../telegram", features = ["fake"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Controls", "Win32_System_Registry", "Win32_NetworkManagement_WNet", "Win32_NetworkManagement_NetManagement"] }
# COM objects for dragging Drive files out as virtual files (`dragout.rs`); the version Rune uses.
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
