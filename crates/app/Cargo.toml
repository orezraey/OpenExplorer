[package]
name = "openexplorer"
version = "0.0.1"
edition.workspace = true

[dependencies]
rune = { workspace = true }
rune-kit = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
openexplorer-gdrive = { path = "../gdrive" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Deleting local files sends them to the Recycle Bin.
trash = "5"
md-5 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Controls"] }
