[package]
name = "openexplorer-b2"
version.workspace = true
edition.workspace = true

# Our own blocking client of B2's native API (v4), not an S3 crate nor an SDK: see the crate
# docs in `src/lib.rs`. Every version here is one Cargo.lock already had, so the build stays
# offline-friendly.
[dependencies]
base64 = "0.22"
# The application key lives in the OS credential store: Credential Manager on Windows.
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
openexplorer-cloud = { path = "../cloud" }
openexplorer-i18n = { path = "../i18n" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
ureq = "3"
