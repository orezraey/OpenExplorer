[package]
name = "openexplorer-onedrive"
version.workspace = true
edition.workspace = true

# Our own client of Microsoft Graph's OneDrive API, blocking on ureq: Microsoft publishes no
# Graph SDK (nor MSAL) for Rust; see the crate docs in `src/lib.rs`. Every version here is one
# Cargo.lock already had, so the build stays offline-friendly.
[dependencies]
aes-gcm = "0.11"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
hkdf = "0.13"
# Refresh tokens and the cache key live in the OS credential store: Credential Manager on
# Windows. Never on disk in the clear.
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
openexplorer-i18n = { path = "../i18n" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ureq = "3"
url = "2"
